version: '3.8'

services:
  # Development service - main service for local development
  app:
    image: ordex-app:latest
    ports:
      - '3000:3000'
    volumes:
      # Mount source code for hot reload
      - .:/app
      # Exclude node_modules and .next to avoid conflicts
      - /app/node_modules
      # Mount package files for dependency changes
      - ./package.json:/app/package.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
    command: npm run dev
    stdin_open: true
    tty: true
    restart: unless-stopped
    # Health check for development
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
